<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Sign-Up Form</title>
  </head>

  <body>
    <div class="home">
      <div class="left-container">
        <div class="left-content">
          <img class="green-leaf-plant" src="images/green-leaf-plant.jpg" alt="western sword fern">
          <div class="logo">
            <img class="odin-head" src="images/odin-lined.png" alt="minimalistic lined odin head">
            <h1 class="title">Odin</h1>
          </div>
        </div>
      </div>
      <div class="right-container">
        <p>
          This is not a real life online service! You know you need something
          <br>this in your life to help you realize your deepest dreams.<br>
          Sign up <em>now</em> to get started.
        </p>
        <p>You <em>know</em> you want to.</p>
        <div class="right-content">
          <p>Let's Do This!</p>
          <div class="full-name">
            <div class="input-content">
              <label for="first-name">First Name</label>
              <input type="text" id="first-name" name="first-name" placeholder="John">
            </div>
            <div class="input-content">
              <label for="last-name">Last Name</label>
              <input type="text" id="last-name" name="last-name" placeholder="Doe">
            </div>
          </div>
          <div class="communication">
            <div class="input-content">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" placeholder="youremail@example.com">
            </div>
            <div class="input-content">
              <label for="phone-number">Phone Number</label>
              <input type="tel" id="phone-number" name="phone-number" placeholder="123-456-7890">
            </div>
          </div>
          <div class="security">
            <div class="input-content">
              <label for="password">Password</label>
              <input type="password" id="password" name="password">
            </div>
            <div class="input-content">
              <label for="confirm-password">Confirm Password</label>
              <input type="password" id="confirm-password" name="confirm-password">
            </div>
          </div>
        </div>
        <div class="sign-up-info">
          <div class="sign-up-content">
            <button type="submit" class="create-account">Create Account</button>
            <p>Already have an account? <a href="#">Log in</a></p>
          </div>
        </div>
      </div>
    </div>
  </body>

</html>
