<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>Document</title>
</head>
<body>
  <div class="left-container">
    <div class="left-content">
      <img class="green-leaf-plant" src="images/green-leaf-plant.jpg" alt="western sword fern">
      <div class="logo">
      <img class="odin-head" src="images/odin-lined.png" alt="minimalistic lined odin head">
      <h1 class="title">Odin</h1>
      </div>
    </div>
  </div>
  <div class="right-container">
    <p>
      This is not a real life online service! You know you need something 
      <br>this in your life to help you realize your deepest dreams.<br>
      Sign up <em>now</em> to get started.
    </p>
    <div class="right-content">
      <p>Let's Do This!</p>
      <div class="full-name">
        <label for="first-name">First Name</label>
        <input type="text" id="first-name" name="first-name" placeholder="John">

        <label for="last-name">Last Name</label>
        <input type="text" id="last-name" name="last-name" placeholder="Doe">
      </div>
      <div class="communication">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="youremail@example.com">

        <label for="phone-number">Phone Number</label>
        <input type="tel" id="tel" name="tel" placeholder="123-456-7890">
      </div>
      <div class="security">
        <label for="password">Password</label>
        <input type="password" id="password" name="password">

        <label for="confirm-password">Confirm Password</label>
        <input type="confirm-password" id="confirm-password" name="confirm-password">
      </div>
    </div>
  </div>
</body>
</html>
